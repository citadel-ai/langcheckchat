<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LangCheck Q&A</title>

 <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="container mt-3">
    <img src="/static/logo.png" alt="Logo" class="logo">
    <h1 class="mt-3 mb-5 text-center">なんでも聞いてね!</h1>

    <div class="mb-2 d-inline-block">
      <span style="font-size: 0.875rem;">難しさ:</span>
      <select id="lv-toggle" class="custom-select custom-select-sm" style="width: 100px;">
        <option value="1" selected>レベル1</option>
        <option value="2">レベル2</option>
        <option value="3">レベル3</option>
      </select>
    </div>

    <div class="input-group mb-3">
      <textarea id="user-input" class="form-control" placeholder="質問を入力..."></textarea>
      <div class="input-group-append">
        <button id="send-button" class="btn btn-success">質問</button>
      </div>
    </div>

    <div id="chat-window" class="mb-3 shadow-sm" style="display: none;"></div>


  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.1/feather.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/static/chat.js"></script>
  <script src="/static/metrics.js"></script>
  <script src="/static/utils.js"></script>
  <script>feather.replace()</script>
</body>

</html>
